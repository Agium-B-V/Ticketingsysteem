name: CI

# Draait bij elke pull request (en op main) lint, typecheck, build en alle tests,
# inclusief de RLS-testset tegen een tijdelijke lokale Supabase in de runner.
# Er worden geen productiegeheimen gebruikt en er wordt nooit met productie verbonden.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, typecheck, unit-tests en build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (met fictieve waarden)
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-fictieve-sleutel
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

  edge-functions:
    name: Typecheck Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Vanuit de functiemap, zodat Deno de npm:-imports zelf ophaalt en niet de
      # package.json/node_modules van de frontend gebruikt.
      - run: deno check --node-modules-dir=none ./*/index.ts
        working-directory: supabase/functions

  supabase:
    name: RLS- en API-tests tegen lokale Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lokale Supabase starten (past alle migraties toe)
        run: supabase start

      - name: Lokale sleutels en URL's exporteren
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: RLS-testset op databaseniveau
        run: npm run test:db

      - name: Edge Functions lokaal serveren
        run: |
          nohup supabase functions serve --env-file supabase/functions/test.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/admin-create-user" || true)
            if [ "$code" = "401" ]; then echo "Functies klaar"; exit 0; fi
            sleep 2
          done
          echo "Functies niet bereikbaar"; cat functions.log; exit 1

      - name: API-testset (REST, Realtime, Edge Functions)
        run: npm run test:api

      - name: Logs bij fouten
        if: failure()
        run: |
          cat functions.log || true
          supabase status || true

      - name: Lokale Supabase stoppen
        if: always()
        run: supabase stop --no-backup
