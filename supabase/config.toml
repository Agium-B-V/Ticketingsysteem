# Configuratie voor de LOKALE Supabase (supabase start), gebruikt in CI en voor
# lokaal ontwikkelen met Docker. De instellingen van het echte project stel je
# in het Supabase-dashboard in (zie docs/CHECKLIST-OPDRACHTGEVER.md).

project_id = "agium-ticketing"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Geen seed met personen. De teams staan in een migratie.
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Zelfregistratie staat uit: accounts maakt alleen een IT-admin aan.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = ""

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# JWT-verificatie door de gateway staat aan; de functies controleren daarnaast
# zelf de gebruiker en is_it_admin() via de database.
[functions.admin-create-user]
verify_jwt = true

[functions.admin-bulk-create-users]
verify_jwt = true

[functions.admin-reset-password]
verify_jwt = true

[functions.admin-set-active]
verify_jwt = true
